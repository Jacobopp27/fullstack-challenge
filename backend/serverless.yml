service: fullstack-challenge-api

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'prod'}
  environment:
    DATABASE_URL: ${env:DATABASE_URL}
    REQRES_API_KEY: ${env:REQRES_API_KEY}
    FRONTEND_URL: ${env:FRONTEND_URL, ''}
functions:
  api:
    handler: index.handler
    events:
      - http:
          path: /
          method: ANY
          cors: true
      - http:
          path: /{proxy+}
          method: ANY
          cors: true
    timeout: 29
    memorySize: 512

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3002

package:
  artifact: .lambda-bundle.zip
